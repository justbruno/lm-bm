[pytest]
# Pytest configuration for lmbm test suite

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
;     --strict-markers
;     --tb=short
;     --durations=10

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests combining multiple components
    slow: Slow tests that may take significant time
    encoding: Tests for encoding modules (Gamma, Poisson, Simplex)
    dataset: Tests for dataset utilities
    models: Tests for neural network models
    training: Tests for training pipeline
    utils: Tests for utility functions
    generators: Tests for data generators

# Logging
log_cli = false
log_cli_level = INFO
log_file = test_results.log
log_file_level = DEBUG

# Timeout for tests (in seconds)
timeout = 300

# Number of workers for parallel testing (uncomment to enable)
# addopts = -n auto
